[build]
  command = "npm run build"
  publish = "dist"

# Astro emits dist/404.html, which Netlify serves automatically for unmatched
# paths with a real 404 status. No SPA catch-all redirect: the old one rewrote
# every path to index.html and returned 200 for pages that don't exist.

# Served as application/octet-stream otherwise, which Chrome refuses to parse
# as a manifest (Safari relies on the apple-touch-icon regardless).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
