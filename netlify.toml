[build]
  command = "npm run build"
  publish = "build"

# Netlify sets CI=true, which makes react-scripts treat lint warnings as
# build errors. The warnings here are pre-existing and harmless.
[build.environment]
  CI = "false"

# Single-page app: serve index.html for any path the CDN has no file for,
# so React Router can handle deep links, refreshes and shared URLs.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
